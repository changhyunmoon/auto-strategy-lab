plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.mch'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 · 화면
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 모델 학습 (로지스틱 회귀 · 결정트리 · 랜덤 포레스트 · 그래디언트 부스팅).
    // 4.4.x 가 JDK 21 로 빌드된 마지막 버전이다. 이 PC 는 Windows 스마트 앱 컨트롤이 서명 없는 DLL 을 막으므로
    // 네이티브 라이브러리(OpenBLAS · DuckDB)는 빼고 순수 Java 로 동작하는 모델만 쓴다.
    implementation('com.github.haifengl:smile-core:4.4.2') {
        exclude group: 'org.bytedeco'
        exclude group: 'org.duckdb'
    }

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 24개월 1분봉으로 지표를 계산하면 메모리를 꽤 쓴다
tasks.named('bootRun') {
    jvmArgs = ['-Xmx4g']
}
