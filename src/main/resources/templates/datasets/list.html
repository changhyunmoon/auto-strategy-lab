<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>데이터세트</title></head>
<body>
<div layout:fragment="topbar" class="topbar"><span class="crumb current">🗂️ 데이터세트</span></div>

<div layout:fragment="content" class="page page--wide" style="max-width:1200px">
  <div class="page-head page-head--row">
    <div>
      <div class="page-icon">🗂️</div>
      <h1 class="page-title">데이터세트</h1>
      <div class="page-desc">받아서 만든 데이터세트 목록입니다. 행을 누르면 상세 화면으로 이동합니다.</div>
    </div>
    <div class="page-head-actions">
      <a class="btn btn-primary" th:href="@{/collect}">＋ 새로 만들기</a>
    </div>
  </div>

  <div class="toolbar">
    <span class="chip-group" id="statusFilter">
      <label class="chip"><input type="radio" name="status" value="ALL" checked>전체 <span class="chip-sub" data-count="ALL"></span></label>
      <label class="chip"><input type="radio" name="status" value="READY">완료 <span class="chip-sub" data-count="READY"></span></label>
      <label class="chip"><input type="radio" name="status" value="RUNNING">진행 중 <span class="chip-sub" data-count="RUNNING"></span></label>
      <label class="chip"><input type="radio" name="status" value="FAILED">실패 <span class="chip-sub" data-count="FAILED"></span></label>
    </span>
    <span class="spacer"></span>
    <input type="text" class="form-control" placeholder="이름으로 찾기" style="width:220px" id="search">
  </div>

  <div class="db-table-wrap">
    <table class="db-table" id="datasetTable">
      <thead>
      <tr>
        <th><span class="th-icon">Aa</span>이름</th>
        <th><span class="th-icon">◉</span>상태</th>
        <th><span class="th-icon">🪙</span>종목</th>
        <th><span class="th-icon">📅</span>기간 (UTC)</th>
        <th><span class="th-icon">⏱️</span>간격</th>
        <th class="num"><span class="th-icon">#</span>열</th>
        <th class="num"><span class="th-icon">#</span>행</th>
        <th><span class="th-icon">🕒</span>생성 (KST)</th>
        <th></th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="empty" id="emptyBox" style="display:none">
    <div class="empty-icon">🗂️</div>
    아직 데이터세트가 없습니다. <a class="link" th:href="@{/collect}">데이터 가져오기</a>에서 만들어 보세요.
  </div>
  <div class="table-footer"><span id="countText"></span></div>
  <div id="failNotes"></div>
</div>

<th:block layout:fragment="scripts">
  <script th:src="@{/js/datasets.js}"></script>
</th:block>
</body>
</html>
