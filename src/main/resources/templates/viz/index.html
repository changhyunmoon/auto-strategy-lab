<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>시각화</title></head>
<body>
<div layout:fragment="topbar" class="topbar"><span class="crumb current">📊 시각화</span></div>

<div layout:fragment="content" class="page page--wide">
  <div class="page-head">
    <h1 class="page-title" style="font-size:26px">📊 시각화</h1>
  </div>

  <div class="empty" th:if="${d == null}">
    <div class="empty-icon">📊</div>
    완료된 데이터세트가 없습니다. <a class="link" th:href="@{/datasets/new}">데이터세트 만들기</a>에서 먼저 만들어 주세요.
  </div>

  <th:block th:if="${d != null}">
    <div id="vizPage" th:data-id="${d.summary.id}"
         th:data-columns="${#strings.listJoin(d.columns.![name], ',')}"
         th:data-features="${#strings.listJoin(d.columns.?[featureCode != 'bar'].![name], ',')}">

      <div class="props" style="margin-bottom:16px">
        <div class="prop">
          <div class="prop-label"><span class="prop-icon">🗂️</span>데이터세트</div>
          <div class="prop-value">
            <select class="form-select" id="datasetSel" style="min-width:280px">
              <option th:each="s : ${datasets}" th:value="${s.id}" th:selected="${s.id == d.summary.id}"
                      th:text="${s.name + ' · ' + s.period}">이름</option>
            </select>
            <a class="btn btn-ghost btn-sm" th:href="@{/datasets/{id}(id=${d.summary.id})}">상세 →</a>
            <a class="btn btn-ghost btn-sm" th:href="@{/datasets/{id}/features(id=${d.summary.id})}">🔎 변수별 설명 · 그래프 →</a>
          </div>
        </div>
        <div class="prop">
          <div class="prop-label"><span class="prop-icon">🪙</span>종목 · 간격</div>
          <div class="prop-value">
            <span class="chip-group">
              <label class="chip" th:each="a, st : ${d.assets}">
                <input type="radio" name="vAsset" th:value="${a.id}" th:checked="${st.first}" th:data-code="${a.code}"><th:block th:text="${a.code}">BTC</th:block>
              </label>
            </span>
            <span class="faint">·</span>
            <span class="chip-group">
              <label class="chip" th:each="iv, st : ${d.intervals}">
                <input type="radio" name="vInterval" th:value="${iv}" th:checked="${st.last}"><th:block th:text="${iv.replace('m', '분')}">15분</th:block>
              </label>
            </span>
          </div>
        </div>
      </div>

      <div data-tabs-scope>
        <div class="tabs">
          <div class="tab active" data-tab="chart">📈 차트</div>
          <div class="tab" data-tab="corr">상관</div>
          <span class="spacer" style="flex:1"></span>
          <a class="small muted link" style="align-self:center;margin-right:4px" th:href="@{/datasets/{id}/features(id=${d.summary.id})}">변수 하나의 분포 · 관계는 변수 탐색 →</a>
        </div>

        <div class="tab-panel active" data-panel="chart">
          <div class="panel-chips" id="indicatorChips">
            <span class="small muted" style="margin-right:2px">지표</span>
            <span class="add-menu" id="addMenu">
              <button class="btn btn-ghost btn-sm" type="button">＋ 지표 추가</button>
              <div class="menu" id="addMenuList"></div>
            </span>
            <span class="spacer" style="flex:1"></span>
            <span class="small muted" id="bucketText"></span>
            <button class="btn btn-ghost btn-sm" id="resetZoom" style="display:none">전체 보기</button>
          </div>
          <div id="mainChart" class="chart" style="height:640px"></div>
          <div class="small faint">드래그·스크롤로 확대합니다. 점이 5,000개를 넘으면 여러 봉을 묶어 보여주고, 확대하면 그 구간을 원래 간격으로 다시 불러옵니다.</div>
        </div>

        <div class="tab-panel" data-panel="corr">
          <div class="callout" style="margin-bottom:12px">
            <div class="callout-icon">🔗</div>
            <div class="callout-body small"><span data-term="correlation">상관</span>이 ±0.8을 넘는 지표 쌍은 거의 같은 정보를 담고 있을 수 있습니다. 둘 중 하나만 써도 되는지 확인하세요.</div>
          </div>
          <div id="corrChart" class="chart" style="height:720px; max-width:980px"></div>
        </div>

      </div>
    </div>
  </th:block>
</div>

<th:block layout:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script th:src="@{/js/echarts-theme.js}"></script>
  <script th:src="@{/js/viz.js}"></script>
</th:block>
</body>
</html>
