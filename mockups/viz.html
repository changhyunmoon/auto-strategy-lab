<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시각화 · 시안</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../src/main/resources/static/css/theme.css">
  <link rel="stylesheet" href="../src/main/resources/static/css/components.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">S</span>자동 전략 탐색</div>
    <a class="nav-item" href="collect.html"><span class="nav-icon">📥</span>데이터 가져오기</a>
    <a class="nav-item" href="datasets.html"><span class="nav-icon">🗂️</span>데이터세트</a>
    <a class="nav-item active" href="viz.html"><span class="nav-icon">📊</span>시각화</a>
    <a class="nav-item" href="instruments.html"><span class="nav-icon">🪙</span>종목 관리</a>
    <div class="sidebar-section">다음 단계</div>
    <a class="nav-item disabled"><span class="nav-icon">⚙️</span>데이터 가공<span class="soon">예정</span></a>
    <a class="nav-item disabled"><span class="nav-icon">🧠</span>모델 학습<span class="soon">예정</span></a>
    <div class="sidebar-footer">시각은 KST로 표시</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="crumb current">📊 시각화</span>
    </div>

    <div class="page page--wide">
      <div class="page-head">
        <h1 class="page-title" style="font-size:26px">📊 시각화</h1>
      </div>

      <!-- 선택 줄 -->
      <div class="props" style="margin-bottom:16px">
        <div class="prop">
          <div class="prop-label"><span class="prop-icon">🗂️</span>데이터세트</div>
          <div class="prop-value">
            <select class="form-select" style="min-width:280px">
              <option>BTC·ETH 7일 전체 지표</option>
              <option>BTC 1개월 추세·변동성</option>
            </select>
          </div>
        </div>
        <div class="prop">
          <div class="prop-label"><span class="prop-icon">🪙</span>종목 · 간격</div>
          <div class="prop-value">
            <span class="chip-group" id="assetSel">
              <label class="chip"><input type="radio" name="vAsset" value="BTC" checked>BTC</label>
              <label class="chip"><input type="radio" name="vAsset" value="ETH">ETH</label>
            </span>
            <span class="faint">·</span>
            <span class="chip-group" id="intervalSel">
              <label class="chip"><input type="radio" name="vInterval" value="1">1분</label>
              <label class="chip"><input type="radio" name="vInterval" value="5">5분</label>
              <label class="chip"><input type="radio" name="vInterval" value="15" checked>15분</label>
            </span>
          </div>
        </div>
      </div>

      <div data-tabs-scope>
        <div class="tabs">
          <div class="tab active" data-tab="chart">📈 차트</div>
          <div class="tab" data-tab="dist">분포</div>
          <div class="tab" data-tab="corr">상관</div>
          <div class="tab" data-tab="scatter">산점도</div>
          <div class="tab" data-tab="quality">품질</div>
        </div>

        <!-- 차트 탭 -->
        <div class="tab-panel active" data-panel="chart">
          <div class="panel-chips" id="indicatorChips">
            <span class="small muted" style="margin-right:2px">지표</span>
            <span class="add-menu" id="addMenu">
              <button class="btn btn-ghost btn-sm" type="button">＋ 지표 추가</button>
              <div class="menu" id="addMenuList"></div>
            </span>
          </div>
          <div id="mainChart" class="chart" style="height:640px"></div>
          <div class="small faint">드래그·스크롤로 확대합니다. 화면 점이 5,000개를 넘으면 서버가 큰 간격으로 묶어 보내고, 확대하면 원래 간격으로 다시 불러옵니다.</div>
        </div>

        <!-- 분포 탭 -->
        <div class="tab-panel" data-panel="dist">
          <div class="toolbar">
            <span class="small muted">지표</span>
            <select class="form-select" id="distSel" style="width:220px"></select>
          </div>
          <div class="two-col">
            <div id="distChart" class="chart chart--sm" style="height:380px"></div>
            <div>
              <h2 class="section-title" style="margin-top:4px">기초 통계</h2>
              <table class="db-table"><tbody id="distStats"></tbody></table>
            </div>
          </div>
        </div>

        <!-- 상관 탭 -->
        <div class="tab-panel" data-panel="corr">
          <div class="callout" style="margin-bottom:12px">
            <div class="callout-icon">🔗</div>
            <div class="callout-body small">상관이 ±0.8을 넘는 지표 쌍은 거의 같은 정보를 담고 있을 수 있습니다. 둘 중 하나만 써도 되는지 확인하세요.</div>
          </div>
          <div id="corrChart" class="chart" style="height:560px; max-width:820px"></div>
        </div>

        <!-- 산점도 탭 -->
        <div class="tab-panel" data-panel="scatter">
          <div class="toolbar">
            <span class="small muted">X</span><select class="form-select" id="scX" style="width:200px"></select>
            <span class="small muted" style="margin-left:8px">Y</span><select class="form-select" id="scY" style="width:200px"></select>
          </div>
          <div id="scatterChart" class="chart" style="height:480px; max-width:820px"></div>
        </div>

        <!-- 품질 탭 -->
        <div class="tab-panel" data-panel="quality">
          <div id="qualityChart" class="chart chart--sm"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="../src/main/resources/static/js/echarts-theme.js"></script>
<script src="../src/main/resources/static/js/common.js"></script>
<script>
$(function () {
  /* ---------- 가짜 데이터 (실제로는 GET /api/viz/{id}/series) ---------- */
  function makeBars(n, start, startPrice) {
    var bars = [], p = startPrice, seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < n; i++) {
      var drift = Math.sin(i / 90) * 0.0006;
      var o = p, c = o * (1 + drift + (rnd() - 0.5) * 0.006);
      var h = Math.max(o, c) * (1 + rnd() * 0.002), l = Math.min(o, c) * (1 - rnd() * 0.002);
      var v = 20 + rnd() * 40 + Math.abs(c - o) / o * 8000;
      bars.push({ t: start + i * 15 * 60000, o: o, h: h, l: l, c: c, v: v, buy: 0.35 + rnd() * 0.3 });
      p = c;
    }
    return bars;
  }
  var bars = makeBars(672, Date.UTC(2026, 9, 15, 0, 0) + 9 * 3600000, 142000000);
  var close = bars.map(function (b) { return b.c; });

  function ema(a, n) { var k = 2 / (n + 1), out = [], prev; a.forEach(function (x, i) { prev = i ? x * k + prev * (1 - k) : x; out.push(i < n - 1 ? null : prev); }); return out; }
  function sma(a, n) { return a.map(function (_, i) { if (i < n - 1) return null; var s = 0; for (var j = i - n + 1; j <= i; j++) s += a[j]; return s / n; }); }
  function std(a, n) { var m = sma(a, n); return a.map(function (_, i) { if (i < n - 1) return null; var s = 0; for (var j = i - n + 1; j <= i; j++) s += Math.pow(a[j] - m[i], 2); return Math.sqrt(s / n); }); }
  function rsi(a, n) { var out = [null], g = 0, l = 0; for (var i = 1; i < a.length; i++) { var d = a[i] - a[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0); if (i <= n) { g += up / n; l += dn / n; out.push(i < n ? null : 100 - 100 / (1 + g / (l || 1e-9))); } else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out.push(100 - 100 / (1 + g / (l || 1e-9))); } } return out; }

  var e20 = ema(close, 20), e60 = ema(close, 60), m20 = sma(close, 20), s20 = std(close, 20);
  var bbU = m20.map(function (m, i) { return m == null ? null : m + 2 * s20[i]; });
  var bbL = m20.map(function (m, i) { return m == null ? null : m - 2 * s20[i]; });
  var e12 = ema(close, 12), e26 = ema(close, 26);
  var macdLine = close.map(function (_, i) { return e26[i] == null ? null : (e12[i] - e26[i]) / close[i] * 100; });
  var macdSig = ema(macdLine.map(function (x) { return x == null ? 0 : x; }), 9).map(function (x, i) { return macdLine[i] == null ? null : x; });
  var macdHist = macdLine.map(function (x, i) { return x == null || macdSig[i] == null ? null : x - macdSig[i]; });
  var rsi14 = rsi(close, 14);
  var vol = bars.map(function (b) { return b.v; }), volAvg = sma(vol, 20);
  var volRatio = vol.map(function (v, i) { return volAvg[i] == null ? null : Math.log(v / volAvg[i]); });
  var buyRatio = bars.map(function (b) { return b.buy; });
  var logRet = close.map(function (c, i) { return i ? Math.log(c / close[i - 1]) * 100 : null; });

  var times = bars.map(function (b) { return new Date(b.t).toISOString().slice(5, 16).replace('T', ' '); });
  var round = function (x) { return x == null ? null : Math.round(x * 10000) / 10000; };

  /* ---------- 지표 목록: overlay = 가격 위, panel = 아래 별도 패널 ---------- */
  var INDICATORS = [
    { id: 'ema20', name: 'EMA 20', type: 'overlay', series: [{ name: 'EMA 20', data: e20 }] },
    { id: 'ema60', name: 'EMA 60', type: 'overlay', series: [{ name: 'EMA 60', data: e60 }] },
    { id: 'bb', name: '볼린저밴드 (20, 2)', type: 'overlay', series: [{ name: 'BB 상단', data: bbU, dashed: true }, { name: 'BB 하단', data: bbL, dashed: true }] },
    { id: 'rsi', name: 'RSI 14', type: 'panel', series: [{ name: 'RSI 14', data: rsi14 }], lines: [30, 70] },
    { id: 'macd', name: 'MACD (12, 26, 9)', type: 'panel', series: [{ name: 'MACD선', data: macdLine }, { name: '신호선', data: macdSig }, { name: '히스토그램', data: macdHist, bar: true }] },
    { id: 'volratio', name: '거래량 비율 (20)', type: 'panel', series: [{ name: '거래량 비율', data: volRatio, bar: true }] },
    { id: 'buy', name: '매수 주도 비율', type: 'panel', series: [{ name: '매수 주도 비율', data: buyRatio }], lines: [0.5] }
  ];
  var active = ['ema20', 'ema60', 'rsi', 'macd'];
  var byId = {}; INDICATORS.forEach(function (d) { byId[d.id] = d; });

  var chart = echarts.init(document.getElementById('mainChart'), 'clean');

  function render() {
    var panels = active.filter(function (id) { return byId[id].type === 'panel'; });
    var top = 30, mainH = 300, volH = 60, panelH = 110, gap = 28;
    var grids = [{ left: 70, right: 24, top: top, height: mainH }, { left: 70, right: 24, top: top + mainH + 8, height: volH }];
    panels.forEach(function (_, i) { grids.push({ left: 70, right: 24, top: top + mainH + 8 + volH + gap + i * (panelH + gap), height: panelH }); });
    var totalH = grids[grids.length - 1].top + grids[grids.length - 1].height + 60;
    $('#mainChart').css('height', totalH + 'px');
    chart.resize();

    var gridIdx = grids.map(function (_, i) { return i; });
    var xAxes = gridIdx.map(function (i) { return { type: 'category', data: times, gridIndex: i, boundaryGap: true, axisLabel: { show: i === grids.length - 1 }, axisPointer: { label: { show: i === grids.length - 1 } } }; });
    var yAxes = gridIdx.map(function (i) { return { scale: true, gridIndex: i, splitNumber: i === 0 ? 5 : 2, axisLabel: { formatter: i === 0 ? function (v) { return (v / 1e6).toFixed(1) + 'M'; } : null } }; });

    var series = [
      { name: 'BTC/KRW', type: 'candlestick', data: bars.map(function (b) { return [b.o, b.c, b.l, b.h]; }), xAxisIndex: 0, yAxisIndex: 0 },
      { name: '거래량', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: bars.map(function (b) { return { value: round(b.v), itemStyle: { color: b.c >= b.o ? 'rgba(224,62,62,.45)' : 'rgba(35,131,226,.45)' } }; }) }
    ];
    active.forEach(function (id) {
      var d = byId[id];
      var gi = d.type === 'overlay' ? 0 : 2 + panels.indexOf(id);
      d.series.forEach(function (s) {
        series.push({
          name: s.name, type: s.bar ? 'bar' : 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: s.data.map(round), showSymbol: false, lineStyle: { width: 1.3, type: s.dashed ? 'dashed' : 'solid' },
          markLine: d.lines ? { silent: true, symbol: 'none', label: { show: false }, lineStyle: { color: '#d3d3cf', type: 'dashed' }, data: d.lines.map(function (y) { return { yAxis: y }; }) } : undefined
        });
      });
    });
    var titles = panels.map(function (id, i) { return { text: byId[id].name, left: 70, top: grids[2 + i].top - 20, textStyle: { fontSize: 12, fontWeight: 500, color: '#787774' } }; });

    chart.setOption({
      animation: false,
      title: titles,
      legend: { top: 0, left: 70, data: series.filter(function (s) { return s.xAxisIndex === 0; }).map(function (s) { return s.name; }) },
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross', link: [{ xAxisIndex: 'all' }] } },
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      grid: grids, xAxis: xAxes, yAxis: yAxes,
      dataZoom: [{ type: 'inside', xAxisIndex: gridIdx, start: 60, end: 100 }, { type: 'slider', xAxisIndex: gridIdx, bottom: 10, height: 22, start: 60, end: 100 }],
      series: series
    }, true);

    // 지표 태그 + 추가 메뉴
    $('#indicatorChips .tag').remove();
    active.forEach(function (id) {
      $('<span class="tag tag-blue"></span>').text(byId[id].name).append(' <span class="x" data-id="' + id + '">✕</span>').insertBefore('#addMenu');
    });
    var $m = $('#addMenuList').empty();
    [['overlay', '가격 위에 겹치기'], ['panel', '아래 패널로 추가']].forEach(function (g) {
      $m.append('<div class="menu-group">' + g[1] + '</div>');
      INDICATORS.filter(function (d) { return d.type === g[0] && active.indexOf(d.id) < 0; }).forEach(function (d) {
        $m.append('<div class="menu-item" data-id="' + d.id + '">' + d.name + '<span class="where">' + (d.type === 'overlay' ? '겹치기' : '패널') + '</span></div>');
      });
    });
  }

  $('#indicatorChips').on('click', '.x', function () { var id = $(this).data('id'); active = active.filter(function (a) { return a !== id; }); render(); });
  $('#addMenu > button').on('click', function (e) { e.stopPropagation(); $('#addMenu').toggleClass('open'); });
  $('#addMenuList').on('click', '.menu-item', function () { active.push($(this).data('id')); $('#addMenu').removeClass('open'); render(); });
  $(document).on('click', function () { $('#addMenu').removeClass('open'); });
  render();

  /* ---------- 분포 · 상관 · 산점도 · 품질 ---------- */
  var COLS = {
    'log_return_1 (%)': logRet, 'rsi_14': rsi14, 'macd_hist': macdHist, 'macd_line': macdLine,
    'ema_dev_20': close.map(function (c, i) { return e20[i] == null ? null : (c / e20[i] - 1) * 100; }),
    'ema_dev_60': close.map(function (c, i) { return e60[i] == null ? null : (c / e60[i] - 1) * 100; }),
    'bb_pctb_20': close.map(function (c, i) { return bbU[i] == null ? null : (c - bbL[i]) / (bbU[i] - bbL[i]); }),
    'volume_ratio_20': volRatio, 'buy_ratio': buyRatio
  };
  var names = Object.keys(COLS);
  names.forEach(function (n) { $('#distSel, #scX, #scY').append('<option>' + n + '</option>'); });
  $('#distSel').val('rsi_14'); $('#scX').val('ema_dev_20'); $('#scY').val('rsi_14');

  var charts = {};
  function getChart(id) { if (!charts[id]) charts[id] = echarts.init(document.getElementById(id), 'clean'); return charts[id]; }
  function clean(a) { return a.filter(function (x) { return x != null && isFinite(x); }); }
  function quantile(sorted, q) { var p = (sorted.length - 1) * q, b = Math.floor(p); return sorted[b] + (sorted[b + 1] - sorted[b] || 0) * (p - b); }

  function renderDist() {
    var raw = COLS[$('#distSel').val()], a = clean(raw), s = a.slice().sort(function (x, y) { return x - y; });
    var min = s[0], max = s[s.length - 1], bins = 40, w = (max - min) / bins || 1, counts = new Array(bins).fill(0);
    a.forEach(function (x) { counts[Math.min(bins - 1, Math.floor((x - min) / w))]++; });
    getChart('distChart').setOption({
      grid: { left: 50, right: 16, top: 16, bottom: 36 }, tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: counts.map(function (_, i) { return (min + w * (i + 0.5)).toFixed(3); }) },
      yAxis: { type: 'value' }, series: [{ type: 'bar', data: counts, barCategoryGap: '8%', itemStyle: { color: '#2383e2', opacity: .75 } }]
    }, true);
    var mean = a.reduce(function (x, y) { return x + y; }, 0) / a.length;
    var sd = Math.sqrt(a.reduce(function (x, y) { return x + Math.pow(y - mean, 2); }, 0) / a.length);
    var rows = [['개수', a.length], ['결측', ((1 - a.length / raw.length) * 100).toFixed(1) + '%'], ['평균', mean.toFixed(4)], ['표준편차', sd.toFixed(4)],
      ['최솟값', min.toFixed(4)], ['25%', quantile(s, .25).toFixed(4)], ['중앙값', quantile(s, .5).toFixed(4)], ['75%', quantile(s, .75).toFixed(4)], ['최댓값', max.toFixed(4)]];
    $('#distStats').html(rows.map(function (r) { return '<tr><td class="muted">' + r[0] + '</td><td class="num">' + r[1] + '</td></tr>'; }).join(''));
  }

  function corr(a, b) {
    var xs = [], ys = [];
    a.forEach(function (x, i) { if (x != null && b[i] != null && isFinite(x) && isFinite(b[i])) { xs.push(x); ys.push(b[i]); } });
    var mx = xs.reduce(function (p, q) { return p + q; }, 0) / xs.length, my = ys.reduce(function (p, q) { return p + q; }, 0) / ys.length, sxy = 0, sx = 0, sy = 0;
    xs.forEach(function (x, i) { sxy += (x - mx) * (ys[i] - my); sx += Math.pow(x - mx, 2); sy += Math.pow(ys[i] - my, 2); });
    return sxy / Math.sqrt(sx * sy);
  }
  function renderCorr() {
    var data = [];
    names.forEach(function (a, i) { names.forEach(function (b, j) { data.push([j, i, Math.round(corr(COLS[a], COLS[b]) * 100) / 100]); }); });
    getChart('corrChart').setOption({
      tooltip: { formatter: function (p) { return names[p.value[1]] + ' × ' + names[p.value[0]] + '<br><b>' + p.value[2] + '</b>'; } },
      grid: { left: 130, right: 80, top: 10, bottom: 110 },
      xAxis: { type: 'category', data: names, axisLabel: { rotate: 40 } }, yAxis: { type: 'category', data: names },
      visualMap: { min: -1, max: 1, calculable: true, orient: 'vertical', right: 0, top: 'center', itemHeight: 200, inRange: { color: ['#2383e2', '#f7f7f5', '#e03e3e'] } },
      series: [{ type: 'heatmap', data: data, label: { show: true, fontSize: 10, color: '#37352f' }, itemStyle: { borderColor: '#fff', borderWidth: 2 } }]
    }, true);
  }

  function renderScatter() {
    var x = COLS[$('#scX').val()], y = COLS[$('#scY').val()], pts = [];
    x.forEach(function (v, i) { if (v != null && y[i] != null) pts.push([round(v), round(y[i])]); });
    getChart('scatterChart').setOption({
      grid: { left: 60, right: 20, top: 20, bottom: 50 }, tooltip: { trigger: 'item' },
      xAxis: { type: 'value', name: $('#scX').val(), nameLocation: 'middle', nameGap: 30, scale: true },
      yAxis: { type: 'value', name: $('#scY').val(), nameLocation: 'middle', nameGap: 44, scale: true },
      series: [{ type: 'scatter', data: pts, symbolSize: 4, itemStyle: { color: '#2383e2', opacity: .45 } }]
    }, true);
  }

  function renderQuality() {
    var days = ['10-15', '10-16', '10-17', '10-18', '10-19', '10-20', '10-21'];
    getChart('qualityChart').setOption({
      legend: { top: 0, left: 0 }, tooltip: { trigger: 'axis' }, grid: { left: 40, right: 16, top: 36, bottom: 30 },
      xAxis: { type: 'category', data: days }, yAxis: { type: 'value', name: '누락 분', minInterval: 1 },
      series: [
        { name: '업비트 KRW-BTC', type: 'bar', data: [0, 0, 0, 0, 0, 0, 0] },
        { name: '업비트 KRW-ETH', type: 'bar', data: [0, 0, 0, 0, 9, 0, 0] },
        { name: '바이낸스 BTCUSDT', type: 'bar', data: [0, 0, 0, 0, 0, 0, 0] },
        { name: '바이낸스 ETHUSDT', type: 'bar', data: [0, 0, 30, 0, 0, 0, 0] }
      ]
    }, true);
  }

  $('#distSel').on('change', renderDist);
  $('#scX, #scY').on('change', renderScatter);
  $(document).on('tab:shown', function (_, name) {
    if (name === 'chart') chart.resize();
    if (name === 'dist') renderDist();
    if (name === 'corr') renderCorr();
    if (name === 'scatter') renderScatter();
    if (name === 'quality') renderQuality();
    Object.keys(charts).forEach(function (k) { charts[k].resize(); });
  });
  $('input[name="vAsset"], input[name="vInterval"]').on('change', function () {
    App.toast('시안에서는 BTC 15분봉 가짜 데이터만 보여줍니다.', 'yellow');
  });
  $(window).on('resize', function () { chart.resize(); Object.keys(charts).forEach(function (k) { charts[k].resize(); }); });
});
</script>
</body>
</html>
